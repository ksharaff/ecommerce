spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/userdb}
spring.datasource.username=${DB_USERNAME:user_service_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

management.endpoints.web.exposure.include=health,info,prometheus
# Exposing ONLY these three, not "*". Actuator ships endpoints that dump environment variables,
# config properties, and thread dumps - genuinely useful in development, genuinely a security
# problem if reachable in production. Allowlist, never wildcard.

management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
# Tags every metric from this service with its name, so Prometheus can tell whose numbers are whose.

jwt.secret=${JWT_SECRET:dev-only-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}