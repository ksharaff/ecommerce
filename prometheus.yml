global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'product-service:8080'
          - 'user-service:8081'
          - 'order-service:8082'
          - 'payment-service:8083'
        # Service names again, not localhost - Prometheus runs in a container alongside them.
        # Hardcoded targets are fine here; in Kubernetes (Phase 5) Prometheus discovers pods
        # automatically instead, which is one of the real arguments for orchestration.