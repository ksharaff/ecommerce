# Four PostgreSQL instances — one per service, enforcing "each service owns its data".
#
# Each database is a StatefulSet (not a Deployment) because it has persistent identity:
# pod product-db-0 must always reattach to its own storage, never another pod's.
# Each is fronted by a headless Service (clusterIP: None), which gives stable DNS.
#
# Note there are no host port mappings here. Inside the cluster every Postgres listens on
# 5432 and is reached by service name. The 5433/5434/5435 offsets in docker-compose existed
# only to avoid collisions on your laptop's ports — irrelevant inside Kubernetes.

apiVersion: v1
kind: Service
metadata:
  name: product-db
spec:
  clusterIP: None            # headless — one stable DNS name per pod, required for StatefulSets
  selector:
    app: product-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-db
spec:
  serviceName: product-db
  replicas: 1
  selector:
    matchLabels:
      app: product-db        # which pods this StatefulSet manages...
  template:
    metadata:
      labels:
        app: product-db      # ...matched against this label on the pods it creates
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: productdb
            - name: POSTGRES_USER
              value: product_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:          # pulled from the Secret, not written inline
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres        # avoids Postgres complaining about the lost+found directory
          resources:
            requests:                  # what the scheduler guarantees this pod
              memory: "256Mi"
              cpu: "100m"              # 100m = 0.1 of a CPU core
            limits:                    # hard ceiling — exceeding the memory limit kills the pod
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
