spring.application.name=payment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/paymentdb}
spring.datasource.username=${DB_USERNAME:payment_service_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8083

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service

# Producer - how outgoing events get turned into bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer - how incoming bytes get turned back into objects
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the real Jackson deserializer so a malformed message (e.g. plain text)
# is logged and skipped instead of blocking the partition forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.khaled.ecommerce.paymentservice.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.khaled.ecommerce.paymentservice.event
spring.kafka.consumer.auto-offset-reset=earliest