spring.application.name=order-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/orderdb}
spring.datasource.username=${DB_USERNAME:order_service_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082

services.product-service.base-url=http://localhost:8080
services.user-service.base-url=http://localhost:8081
