services:

# Product Database
  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

# User Database
  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

# Order Database
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_service_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service_user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

# Product Service
  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/productdb
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: devpassword
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      product-db:
        condition: service_healthy

# User Service
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user_service_user
      SPRING_DATASOURCE_PASSWORD: devpassword
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      user-db:
        condition: service_healthy

# Order Service
  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orderdb
      DB_USERNAME: order_service_user
      DB_PASSWORD: devpassword
      SERVICES_PRODUCT-SERVICE_BASE-URL: http://product-service:8080
      SERVICES_USER-SERVICE_BASE-URL: http://user-service:8081
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8082"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

volumes:
  product-db-data:
  user-db-data:
  order-db-data:

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093,CONTROLLER://localhost:9094
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1